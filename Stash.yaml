# Stash 主配置：配合本地私密覆写使用。
# 源配置作者：Repcz（https://github.com/Repcz/Tool），由上传的主配置及覆写整理。
# 真实订阅地址与 SOCKS5 凭据留在本地覆写中；Tailscale 在各设备内交互登录。
# 使用前先导入本地私密覆写；切换后停用原六份覆写，避免重复合并。

mode: rule
log-level: info
dns:
  nameserver:
  - https://dns.alidns.com/dns-query
  - https://doh.pub/dns-query
  fake-ip-filter:
  - +.lan
  - '*'
  - +.local
  - +.cmpassport.com
  - id6.me
  - open.e.189.cn
  - mdn.open.wo.cn
  - opencloud.wostore.cn
  - auth.wosms.cn
  - +.10099.com.cn
  - +.msftconnecttest.com
  - +.msftncsi.com
  - lancache.steamcontent.com
  default-nameserver:
  - https://223.5.5.5/dns-query
  proxy-server-nameserver:
  - https://223.5.5.5/dns-query
proxy-providers: {}
proxies: []
proxy-groups:
- name: 链式入口
  type: select
  hidden: false
  proxies:
  - HongKong
  - United States
  - Singapore
  - Japan
  - Taiwan
