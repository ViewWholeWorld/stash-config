#SUBSCRIBED https://raw.githubusercontent.com/ViewWholeWorld/stash-config/refs/heads/main/Stash.yaml
# Stash 主配置：配合本地私密覆写使用。
# 源配置作者：Repcz（https://github.com/Repcz/Tool），由上传的主配置及覆写整理。
# 真实订阅地址与 SOCKS5 凭据留在本地覆写中；Tailscale 在各设备内交互登录。
# 使用前先导入本地私密覆写；切换后停用原六份覆写，避免重复合并。

mode: rule
log-level: info
dns:
  # 境外 DoH 按规则经自动兜底组转发；节点域名仍由独立 DNS 直连解析。
  follow-rule: true
  nameserver:
  - https://dns.alidns.com/dns-query
  - https://doh.pub/dns-query
  fallback:
  - https://1.1.1.1/dns-query
  - https://8.8.8.8/dns-query
  fallback-filter:
    geoip: true
    geoip-code: CN
    ipcidr:
    - 240.0.0.0/4
    domain:
    - +.google.com
    - +.googleapis.com
    - +.gstatic.com
    - +.youtube.com
    - +.googlevideo.com
    - +.ytimg.com
  fake-ip-filter:
  - +.lan
  - '*'
  - +.local
  - +.cmpassport.com
  - id6.me
  - open.e.189.cn
  - mdn.open.wo.cn
  - opencloud.wostore.cn
  - auth.wosms.cn
  - +.10099.com.cn
  - +.msftconnecttest.com
  - +.msftncsi.com
  - lancache.steamcontent.com
  default-nameserver:
  - https://223.5.5.5/dns-query
  proxy-server-nameserver:
  - https://223.5.5.5/dns-query
proxy-providers: {}
proxies: []
proxy-groups:
- name: 自动兜底
  type: url-test
  interval: 1800
  tolerance: 100
  lazy: true
  proxies:
  - HongKong
  - Singapore
  - Japan
  - Taiwan
  - United States
# 私密覆写注入“静态IP｜链路｜...”节点；每个节点固定一个入口，测速包含完整链路。
- name: 静态IP
  type: url-test
  interval: 600
  tolerance: 100
  lazy: true
  include-all: true
  filter: '(?i)^静态IP｜链路｜'
- name: Manual
  icon: https://github.com/shindgewongxj/WHATSINStash/raw/main/icon/%24tash.png
  type: select
  proxies:
  - 自动兜底
  - 静态IP
  - 倍率×10
  - 倍率×3
  - HongKong
  - United States
  - Singapore
  - Japan
  - Taiwan
  - 其他地区
  - DIRECT
- name: 倍率×10
  type: select
  include-all: true
  filter: '(?i)(?:×|x)\s*10|10\s*倍'
- name: 倍率×3
  type: select
  include-all: true
  filter: '(?i)(?:×|x)\s*3|3\s*倍'
- name: 其他地区
  type: select
  include-all: true
  filter: '(?i)^(?!.*静态IP｜链路｜)(?!.*(?:×|x)\s*(?:3|10)|.*(?:3|10)\s*倍).*(?:🇲🇴|澳门|澳門|Macau|🇰🇷|韩国|南韩|Korea|🇩🇪|德国|Germany|🇬🇧|英国|英國|UK|United Kingdom|🇳🇱|荷兰|荷蘭|Netherlands|🇹🇷|土耳其|Turkey|🇧🇷|巴西|Brazil|🇦🇺|澳大利亚|澳洲|Australia)'
- name: Global
  icon: https://raw.githubusercontent.com/Koolson/Qure/master/IconSet/Color/Global.png
  type: select
  proxies:
  - 静态IP
  - Manual
  - 倍率×10
  - 倍率×3
  - HongKong
  - United States
  - Singapore
  - Japan
  - Taiwan
  - 其他地区
- name: GFWList
