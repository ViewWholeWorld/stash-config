rules:
# 使用 IP 地址访问境外 DoH，避免解析 DNS 服务器域名形成依赖循环。
- IP-CIDR,1.1.1.1/32,自动兜底,no-resolve
- IP-CIDR,8.8.8.8/32,自动兜底,no-resolve
- IP-CIDR,223.5.5.5/32,DIRECT,no-resolve
- RULE-SET,AppleServers,Manual
- RULE-SET,Direct,DIRECT
- RULE-SET,Reject,REJECT
- RULE-SET,AI,AI
- RULE-SET,Telegram,Telegram
- RULE-SET,Twitter,Social
- RULE-SET,Facebook,Social
- RULE-SET,TikTok,Social
- RULE-SET,Steam,Game
- RULE-SET,Epic,Game
- RULE-SET,Google,Google
- RULE-SET,Github,Microsoft
- RULE-SET,Microsoft,Microsoft
- RULE-SET,Emby,Emby
- RULE-SET,Spotify,Spotify
- RULE-SET,Bahamut,Streaming
- RULE-SET,Netflix,Streaming
- RULE-SET,Disney,Streaming
- RULE-SET,PrimeVideo,Streaming
- RULE-SET,HBO,Streaming
- RULE-SET,Proxy,Global
- RULE-SET,Lan,DIRECT
- RULE-SET,GFWList,GFWList
- GEOIP,CN,DIRECT
- MATCH,Final
