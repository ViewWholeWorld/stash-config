- name: HongKong
  icon: https://raw.githubusercontent.com/Koolson/Qure/master/IconSet/Color/Hong_Kong.png
  type: url-test
  interval: 600
  tolerance: 100
  lazy: true
  filter: '(?i)^(?!.*静态IP｜链路｜)(?!.*(?:×|x)\s*(?:3|10)|.*(?:3|10)\s*倍).*(?:🇭🇰|香港|(\b(HK|Hong)\b))'
  include-all: true
